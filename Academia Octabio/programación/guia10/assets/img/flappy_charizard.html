 function beep(freq=520,dur=.06){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
 function jump(){if(state==='over'){reset();state='playing';bird.vy=flap;beep();return}if(state==='ready')state='playing';if(state==='playing'){bird.vy=flap;beep(620)}}
 function addPipe(){const margin=90,top=margin+Math.random()*(H-groundH-gap-margin*2);pipes.push({x:W+10,top,passed:false});}
 function end(){state='over';beep(180,.18);if(score>best){best=score;localStorage.setItem('flappyBest',best)}}
 function update(){frame++;if(state==='ready'){bird.y=270+Math.sin(frame*.06)*8;return}if(state!=='playing')return;
  bird.vy+=gravity;bird.y+=bird.vy;bird.rot=Math.min(.9,Math.max(-.5,bird.vy*.08));
  if(++spawn>94){spawn=0;addPipe()}for(const p of pipes){p.x-=speed;
   if(!p.passed&&p.x+pipeW<bird.x){p.passed=true;score++;beep(820,.045)}
   const withinX=bird.x+bird.r>p.x&&bird.x-bird.r<p.x+pipeW;
   if(withinX&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+gap))end();
  }pipes=pipes.filter(p=>p.x+pipeW> -5);
  if(bird.y-bird.r<0||bird.y+bird.r>H-groundH)end();
 }
 function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
 function draw(){ctx.clearRect(0,0,W,H);
  // cielo y sol
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#75d5f0');sky.addColorStop(1,'#d5f5d7');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff4b0';ctx.beginPath();ctx.arc(385,100,38,0,Math.PI*2);ctx.fill();
  // nubes
  ctx.fillStyle='#ffffff99';for(let i=0;i<4;i++){let x=((i*155-frame*.35)%(W+100)+W+100)%(W+100)-40,y=125+i%2*85;ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);ctx.arc(x+22,y-9,24,0,Math.PI*2);ctx.arc(x+48,y,18,0,Math.PI*2);ctx.fill()}
  // tuberías
  for(const p of pipes){let bottomY=p.top+gap;rounded(p.x,0,pipeW,p.top-18,8,'#259c59');rounded(p.x-6,p.top-24,pipeW+12,24,5,'#35bd6d');rounded(p.x,bottomY+18,pipeW,H-groundH-bottomY-18,8,'#259c59');rounded(p.x-6,bottomY,pipeW+12,24,5,'#35bd6d');ctx.fillStyle='#ffffff35';ctx.fillRect(p.x+12,0,7,Math.max(0,p.top-25));ctx.fillRect(p.x+12,bottomY+26,7,Math.max(0,H-groundH-bottomY-30))}
  // suelo
  ctx.fillStyle='#d9b66c';ctx.fillRect(0,H-groundH,W,groundH);ctx.fillStyle='#78c94d';ctx.fillRect(0,H-groundH,W,15);ctx.fillStyle='#b58a4b';for(let x=-((frame*2)%36);x<W;x+=36){ctx.fillRect(x,H-groundH+28,18,5);ctx.fillRect(x+15,H-groundH+52,18,5)}
  // Personaje: Charizard de la imagen proporcionada
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  if(flyer.complete && flyer.naturalWidth){
    const drawW=82, drawH=82;
    ctx.drawImage(flyer,-drawW/2,-drawH/2,drawW,drawH);
  } else {
    ctx.fillStyle='#e99b2e';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // marcador
  ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.lineWidth=5;ctx.strokeStyle='#24435b66';ctx.strokeText(score,W/2,64);ctx.fillStyle='#fff';ctx.fillText(score,W/2,64);
  ctx.textAlign='left';ctx.font='bold 14px system-ui';ctx.fillStyle='#25445a';ctx.fillText('MEJOR: '+best,18,30);
  if(state==='ready'||state==='over'){ctx.fillStyle='#10243c88';ctx.fillRect(0,0,W,H-groundH);rounded(42,215,396,180,20,'#17314deF');ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 29px system-ui';ctx.fillText(state==='ready'?'¡A VOLAR!':'FIN DEL JUEGO',W/2,265);ctx.font='17px system-ui';ctx.fillText(state==='ready'?'Pulsa ESPACIO para comenzar':'Puntuación: '+score,W/2,310);ctx.font='14px system-ui';ctx.fillStyle='#cce5f4';ctx.fillText(state==='ready'?'Esquiva las tuberías':'Pulsa ESPACIO para intentarlo otra vez',W/2,345)}
 }
 function loop(){update();draw();requestAnimationFrame(loop)}
 document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}});
 canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('start').addEventListener('click',()=>{reset();state='playing';bird.vy=flap});
 document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent='Sonido: '+(soundOn?'activado':'desactivado');if(soundOn)beep()});
 reset();loop();
})();
</script>
</body></html>
